<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#143c46"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta name="description" content="A private pocket companion. Unlock with your shared passphrase."><title>Our Coastal Escape</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png"><style>
:root{color-scheme:light;--ink:#143c46;--muted:#67756d;--gold:#ad8c59}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#f6f2e9;color:var(--ink);font:14px/1.6 system-ui,sans-serif;display:grid;place-items:center;padding:28px 22px}.lock-wrap{width:min(100%,410px)}.kicker{letter-spacing:.2em;font-size:10px;color:#85775e;text-align:center}.compass{display:block;width:70px;height:70px;margin:0 auto 23px}h1{font:400 47px/1.1 Georgia,serif;letter-spacing:-.04em;text-align:center;margin:17px 0}p{text-align:center;color:var(--muted);font-size:13px;margin:16px 0 25px}.lock-card{border:1px solid #d9d8c8;background:#fffcf7;padding:27px;border-radius:10px;box-shadow:0 15px 40px #173a4210}label{display:block;font-size:12px;margin-bottom:8px}.password-row{display:flex;border:1px solid #c4ccbb;border-radius:6px;background:#faf7ef;overflow:hidden}input[type=password],input[type=text]{width:100%;min-width:0;background:transparent;border:0;padding:14px 12px;font:16px system-ui;color:var(--ink)}button{font:inherit;cursor:pointer;color:inherit}.show-button{border:0;border-left:1px solid #deded0;background:transparent;padding:0 13px;font-size:11px}.remember{display:flex;align-items:start;gap:10px;font-size:11px;color:var(--muted);margin:17px 0}.remember input{width:18px;height:18px;accent-color:#2f726e;flex:none}.unlock{width:100%;min-height:46px;background:var(--ink);color:#fffaf1;border:0;border-radius:6px;font-size:12px}.unlock:disabled{opacity:.65;cursor:wait}#unlock-error{margin:13px 0 0;color:#9a4839;font-size:12px;text-align:left;min-height:19px}#offline-note{margin:17px 0 0;font-size:11px;text-align:center;color:var(--muted)}.footnote{text-align:center;font-size:10px;color:#8b8b78;margin-top:23px}button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}@media(max-width:380px){h1{font-size:43px}.lock-card{padding:23px}}
</style><script defer src="gate.js"></script></head><body><main class="lock-wrap"><img class="compass" src="icon.svg" alt=""><div class="kicker">A LITTLE WORLD, JUST FOR US</div><h1>Our coastal<br>escape.</h1><p>Something lovely is waiting inside.<br>Enter our shared passphrase to make yourself at home.</p><form class="lock-card" id="unlock-form"><label for="passphrase">Our shared passphrase</label><div class="password-row"><input id="passphrase" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required aria-describedby="unlock-error"><button class="show-button" id="show-passphrase" type="button" aria-pressed="false">Show</button></div><label class="remember"><input type="checkbox" id="remember-phone"><span>Keep this phone unlocked for 10 days.<br>Only choose this on your own phone.</span></label><button class="unlock" type="submit" id="unlock-button">Let’s escape →</button><div id="unlock-error" role="alert" aria-live="polite"></div><div id="offline-note" role="status">Saving our encrypted guide for offline use…</div></form><div class="footnote">The guide unlocks on your device.<br>Your passphrase isn’t sent to the hosting service.</div><noscript><p>Turn on JavaScript to unlock the encrypted guide.</p></noscript></main></body></html>
